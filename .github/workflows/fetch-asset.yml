name: Fetch update asset

on:
  push:
    branches:
      - arena/01a0ee5f-laughing-chainsaw
    paths:
      - '.github/workflows/fetch-asset.yml'

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0ee5f-laughing-chainsaw
          fetch-depth: 0

      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dl
          gh release download unturned --repo "$GITHUB_REPOSITORY" --dir /tmp/dl --clobber
          cd /tmp/dl
          ls -l
          sha256sum ./*.zip | tee SHA256SUM.txt

      - name: Extract update into the repository
        run: |
          set -euo pipefail
          cd /tmp/dl
          ZIP=$(ls ./*.zip | head -1)
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          rm -f update-manifest.txt
          echo "== imported tree =="
          find U3-SDK -type f | wc -l
          du -sh U3-SDK
          git status --porcelain | head -20

      - name: Commit imported update
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Nightfall Survival Expansion v3.26.3.12.1 (Unturned U3 SDK) [skip ci]"
          git push origin HEAD:arena/01a0ee5f-laughing-chainsaw
